name: Release to Cloudflare R2

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FEURSTAGRAM_KEY_ALIAS: ${{ secrets.FEURSTAGRAM_KEY_ALIAS || 'feurstagram' }}
      FEURSTAGRAM_KEYSTORE_PASS: ${{ secrets.FEURSTAGRAM_KEYSTORE_PASS }}
      FEURSTAGRAM_KEY_PASS: ${{ secrets.FEURSTAGRAM_KEY_PASS }}
      FEURSTAGRAM_KEYSTORE_BASE64: ${{ secrets.FEURSTAGRAM_KEYSTORE_BASE64 }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PUBLIC_UPDATE_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      UPLOAD_MODE: rclone
      R2_REMOTE: ${{ secrets.R2_REMOTE || 'r2' }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK tools
        shell: bash
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER after unzip" >&2
            exit 1
          fi

          (yes 2>/dev/null || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"

      - name: Install rclone
        run: |
          sudo -n apt-get update >/dev/null
          sudo -n apt-get install -y rclone >/dev/null

      - name: Prepare keystore
        shell: bash
        run: |
          if [ -n "${FEURSTAGRAM_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$FEURSTAGRAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/feurstagram.keystore"
            echo "FEURSTAGRAM_KEYSTORE=$RUNNER_TEMP/feurstagram.keystore" >> "$GITHUB_ENV"
          fi

      - name: Ensure required input APK exists
        shell: bash
        run: |
          if [ ! -f build/inputs/instagram-454.apkm ] && [ ! -f build/inputs/instagram-435.apkm ]; then
            echo "No input APK/APKM was found in build/inputs/. Add a local base Instagram bundle or provide one in build/inputs/." >&2
            exit 1
          fi

      - name: Build Feurstagram release APK
        shell: bash
        run: |
          INPUT_APK="$(ls build/inputs/*.apkm build/inputs/*.apk 2>/dev/null | head -n 1)"
          if [ -z "$INPUT_APK" ]; then
            echo "No input APK file found in build/inputs/." >&2
            exit 1
          fi
          ./build.sh "$INPUT_APK"

      - name: Publish update package and upload to Cloudflare R2
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(date -u +%Y.%m.%d)"
          fi
          ./scripts/publish_update.sh build/outputs/feurstagram.apk "$VERSION" "$PUBLIC_UPDATE_BASE_URL" public
          rclone copy public/feurstagram-release.apk "${R2_REMOTE}:${R2_BUCKET}/" --quiet
          rclone copy public/updates.json "${R2_REMOTE}:${R2_BUCKET}/" --quiet

      - name: Verify public URLs respond
        shell: bash
        run: |
          if [ -n "${PUBLIC_UPDATE_BASE_URL:-}" ]; then
            curl -fsSL "$PUBLIC_UPDATE_BASE_URL/updates.json" | head -c 200
            echo
            curl -fsSL -I "$PUBLIC_UPDATE_BASE_URL/feurstagram-release.apk" | head -n 5
          else
            echo "PUBLIC_UPDATE_BASE_URL is empty; skipping remote verification."
          fi
